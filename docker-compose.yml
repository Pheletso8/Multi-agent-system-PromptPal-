services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SCHOLAR_URL=http://scholar:8001/solve
      - COACH_URL=http://coach:8002/process
      - FORMATTER_URL=http://formatter:8003/format
    restart: always
    depends_on:
      - scholar
      - coach
      - formatter
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  scholar:
    build: ./agents/scholar
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  coach:
    build: ./agents/coach
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  formatter:
    build: ./agents/formatter
    ports:
      - "8003:8003"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
