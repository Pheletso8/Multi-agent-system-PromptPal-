services:
  # 1. API Gateway (The 'api' service)
  - type: web
    name: promptpal-api
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SCHOLAR_URL
        value: http://promptpal-scholar/solve
      - key: COACH_URL
        value: http://promptpal-coach/process
      - key: FORMATTER_URL
        value: http://promptpal-formatter/format

  # 2. Scholar Agent
  - type: pserv # 'pserv' is a Private Service, only accessible internally
    name: promptpal-scholar
    runtime: docker
    dockerContext: agents/scholar
    dockerfilePath: agents/scholar/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set this manually in Render Dashboard for security

  # 3. Coach Agent
  - type: pserv
    name: promptpal-coach
    runtime: docker
    dockerContext: agents/coach
    dockerfilePath: agents/coach/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false

  # 4. Formatter Agent
  - type: pserv
    name: promptpal-formatter
    runtime: docker
    dockerContext: agents/formatter
    dockerfilePath: agents/formatter/Dockerfile
    healthCheckPath: /health
