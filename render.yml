services:
  - type: web
    name: promptpal-api
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SCHOLAR_URL
        value: https://promptpal-scholar.onrender.com/solve
      - key: COACH_URL
        value: https://promptpal-coach.onrender.com/process
      - key: FORMATTER_URL
        value: https://promptpal-formatter.onrender.com/format
      - key: INTERNAL_SECRET
        generateValue: true

  - type: web
    name: promptpal-scholar
    runtime: docker
    dockerContext: agents/scholar
    dockerfilePath: agents/scholar/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: INTERNAL_SECRET
        fromService:
          name: promptpal-api
          type: web
          envVarKey: INTERNAL_SECRET

  - type: web
    name: promptpal-coach
    runtime: docker
    dockerContext: agents/coach
    dockerfilePath: agents/coach/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: INTERNAL_SECRET
        fromService:
          name: promptpal-api
          type: web
          envVarKey: INTERNAL_SECRET

  - type: web
    name: promptpal-formatter
    runtime: docker
    dockerContext: agents/formatter
    dockerfilePath: agents/formatter/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INTERNAL_SECRET
        fromService:
          name: promptpal-api
          type: web
          envVarKey: INTERNAL_SECRET

  - type: cron
    name: promptpal-keepalive
    runtime: python
    buildCommand: pip install httpx
    startCommand: python keep_alive.py
    schedule: "*/10 * * * *"
    plan: free